<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Samurai Meet ログイン処理中</title>
  </head>
  <body>
    <main>
      <h1>ログイン処理中</h1>
      <p id="status">Googleの認証結果を安全に交換しています。</p>
    </main>
    <script>
      const status = document.querySelector('#status');
      const params = new URLSearchParams(window.location.search);
      const code = params.get('handoff_code');
      const verifier = sessionStorage.getItem('samurai_dev_oauth_handoff_verifier');
      history.replaceState(null, '', '/auth/complete');

      async function complete() {
        if (!code || !verifier) throw new Error('handoff情報がありません。最初からログインしてください');
        const response = await fetch('/api/v1/auth/google/exchange', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ handoff_code: code, handoff_verifier: verifier }),
        });
        const body = await response.json();
        if (!response.ok || !body.data) throw new Error(`交換失敗 (${response.status})`);
        if (body.data.access_token) {
          sessionStorage.setItem('samurai_dev_session', JSON.stringify(body.data));
          sessionStorage.removeItem('samurai_dev_pre_auth');
        } else if (body.data.pre_auth_token) {
          sessionStorage.setItem('samurai_dev_pre_auth', JSON.stringify(body.data));
        } else {
          throw new Error('Google交換結果に認証状態がありません');
        }
        sessionStorage.removeItem('samurai_dev_oauth_handoff_verifier');
        window.location.replace('/');
      }

      complete().catch((error) => { status.textContent = error.message; });
    </script>
  </body>
</html>
