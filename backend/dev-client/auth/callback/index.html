<!doctype html><html lang="ja"><meta charset="utf-8"><title>Google ログイン処理中</title><pre id="result">Google ログインを処理しています。</pre><script>
const p=new URLSearchParams(location.search), out=document.querySelector('#result');
fetch('/api/v1/auth/google/exchange',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:p.get('code'),state:p.get('state')})})
 .then(async r=>({status:r.status,body:await r.json()})).then(x=>out.textContent=JSON.stringify(x,null,2)).catch(e=>out.textContent=`失敗: ${e.message}`);
</script></html>
