<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Samurai Meet Domain API Test</title>
  </head>
  <body>
    <h1>ドメイン経由 API 確認</h1>
    <p>接続先: <code id="endpoint"></code></p>
    <button id="health">ヘルスチェック</button>
    <button id="ready">Readiness 確認</button>
    <pre id="result">まだ実行していません。</pre>
    <script>
      const result = document.querySelector('#result');
      const endpoint = document.querySelector('#endpoint');
      const baseURL = `${window.location.origin}/api/v1`;
      endpoint.textContent = baseURL;

      for (const button of document.querySelectorAll('button')) {
        button.addEventListener('click', async () => {
          const path = button.id === 'health' ? '/healthz' : '/readyz';
          const url = `${baseURL}${path}`;
          result.textContent = `リクエスト中: ${url}`;
          try {
            const response = await fetch(url);
            result.textContent = JSON.stringify({ status: response.status, body: await response.json() }, null, 2);
          } catch (error) {
            result.textContent = `失敗: ${error.message}`;
          }
        });
      }
    </script>
  </body>
</html>
