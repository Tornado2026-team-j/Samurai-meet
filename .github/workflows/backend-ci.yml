name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      TEST_POSTGRES: "1"
      RUN_DATABASE_SMOKE_TEST: "1"
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: samurai_meet
      DB_USER: samurai_meet_app
      DB_PASSWORD: samurai_meet_password
      DB_SSLMODE: disable
      DB_SCHEMA: public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: samurai_meet
          POSTGRES_USER: samurai_meet_app
          POSTGRES_PASSWORD: samurai_meet_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U samurai_meet_app -d samurai_meet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Go をセットアップ
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: true

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: フォーマットを検査
        run: test -z "$(gofmt -l $(find . -name '*.go' -type f))"

      - name: 静的検査
        run: go vet ./...

      - name: テスト
        run: go test ./...

      - name: ビルド
        run: go build ./cmd/server

      - name: フロントエンド接続を想定したスモークテスト
        run: python tests/frontend_smoke_test.py

      - name: 開発用鍵生成スクリプトをテスト
        run: python -m unittest discover -s scripts -p "test_*.py"
