name: Nana PR Agent

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read
  checks: read
  statuses: read

concurrency:
  group: nana-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  nana:
    if: >-
      (
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.draft == false &&
        (
          github.event.pull_request.author_association == 'OWNER' ||
          github.event.pull_request.author_association == 'MEMBER' ||
          github.event.pull_request.author_association == 'COLLABORATOR'
        )
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.user.type != 'Bot' &&
        contains(github.event.comment.body, '@nana') &&
        !contains(github.event.comment.body, '@nana apply') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      )
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NANA_PLAN_SECRET: ${{ secrets.NANA_PLAN_SECRET }}
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      GH_EVENT_NAME: ${{ github.event_name }}
      NANA_MODEL: gpt-5.6-luna
      NANA_REASONING_EFFORT: medium

    steps:
      # pull_request_target / issue_commentではdefault branchの信頼済みNanaコードだけを実行。
      # PR headはcheckoutしない。
      - name: Checkout trusted Nana code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet openai requests

      - name: Run Nana
        run: python .github/scripts/nana.py
