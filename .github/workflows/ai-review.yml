name: AI Pull Request Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Draft PRでは実行しない
    if: github.event.pull_request.draft == false

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install openai requests

      - name: Get PR diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff \
            --no-ext-diff \
            --unified=5 \
            "$BASE_SHA" "$HEAD_SHA" \
            > /tmp/pr.diff

          echo "Diff size:"
          wc -c /tmp/pr.diff
          echo "Changed lines:"
          wc -l /tmp/pr.diff

      - name: Review with OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}

          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}

          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}

          PR_AUTHOR: ${{ github.event.pull_request.user.login }}

        run: |
          python - <<'PY'
          import json
          import os
          import requests

          from openai import OpenAI


          MAX_DIFF_CHARS = 500_000

          repository = os.environ["REPOSITORY"]
          pr_number = int(os.environ["PR_NUMBER"])
          pr_title = os.environ.get("PR_TITLE", "")
          pr_body = os.environ.get("PR_BODY", "")
          pr_author = os.environ.get("PR_AUTHOR", "")
          base_ref = os.environ.get("BASE_REF", "")
          head_ref = os.environ.get("HEAD_REF", "")

          gh_token = os.environ["GH_TOKEN"]

          with open("/tmp/pr.diff", "r", encoding="utf-8", errors="replace") as f:
              diff = f.read()

          original_diff_length = len(diff)

          if len(diff) > MAX_DIFF_CHARS:
              diff = diff[:MAX_DIFF_CHARS]
              diff_notice = (
                  f"\n\n注意: PR差分が非常に大きいため、"
                  f"先頭 {MAX_DIFF_CHARS:,} 文字のみレビュー対象です。"
                  f"元の差分サイズは {original_diff_length:,} 文字です。"
              )
          else:
              diff_notice = ""


          system_prompt = """
          あなたはGitHub Pull Requestをレビューするシニアソフトウェアエンジニアです。

          日本語でレビューしてください。

          あなたの目的:
          - PRで何が変更されたか簡潔に説明する
          - 良い実装や改善点を具体的に褒める
          - バグ、機能退行、セキュリティ、UX、パフォーマンス、
            保守性などの問題を見つける
          - 実装意図が不明な場合は、問題だと断定せず質問する
          - PRタイトル・説明と実際の差分が大きくズレている場合は指摘する

          特に注意すること:
          - 既存機能が削除されていないか
          - エラー処理が弱くなっていないか
          - 認証・認可が弱くなっていないか
          - ユーザー入力の検証が不足していないか
          - 日本語・英語などローカライズに不整合がないか
          - UI変更による機能退行がないか
          - 不要な巨大差分や無関係な変更が混ざっていないか
          - TODO、仮実装、ハードコードなどが残っていないか

          レビュー方針:
          - 根拠のない指摘は禁止
          - diffから判断できない仕様を勝手に決めつけない
          - コーディングスタイルなど些細な好みは原則指摘しない
          - 良い点があれば必ず褒める
          - 問題がなければ無理に問題を作らない
          - 開発者に対して攻撃的な表現を使わない
          - 「確認したいこと」と「明確な問題」を区別する
          """


          user_prompt = f"""
          以下のPull Requestをレビューしてください。

          Repository:
          {repository}

          PR:
          #{pr_number}

          Author:
          {pr_author}

          Title:
          {pr_title}

          Description:
          {pr_body or "(説明なし)"}

          Base:
          {base_ref}

          Head:
          {head_ref}

          Diff:
          ```diff
          {diff}
          ```

          {diff_notice}

          出力はGitHub上で人間が読みやすいMarkdownにしてください。

          必ず以下の構成にしてください:

          ## 🤖 AI Review

          ### 📝 変更概要
          箇条書き

          ### 👍 良かった点
          良かったところを具体的に説明

          ### ⚠️ 気になる点
          明確な問題・リスクのみ
          問題がなければ「特に見つかりませんでした」

          ### 💬 確認したいこと
          仕様や意図を確認すべきもの
          なければ「特になし」

          ### 📊 総評
          PR全体について短くまとめる

          重要:
          自動レビューなので、最終判断は人間が行う前提で書いてください。
          """


          client = OpenAI()

          response = client.responses.create(
              model="gpt-5.6-terra",
              reasoning={
                  "effort": "high",
              },
              input=[
                  {
                      "role": "system",
                      "content": system_prompt,
                  },
                  {
                      "role": "user",
                      "content": user_prompt,
                  },
              ],
          )

          review = response.output_text.strip()

          marker = "<!-- samurai-meet-ai-review -->"

          body = f"""{marker}

          {review}

          ---
          _Generated automatically with OpenAI. AIの指摘は参考情報として扱い、最終判断は人間が行ってください。_
          """

          headers = {
              "Authorization": f"Bearer {gh_token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          # 既存AIレビューコメントを探す
          comments_url = (
              f"https://api.github.com/repos/{repository}"
              f"/issues/{pr_number}/comments"
          )

          response = requests.get(
              comments_url,
              headers=headers,
              timeout=30,
          )
          response.raise_for_status()

          comments = response.json()

          existing = None

          for comment in comments:
              if marker in comment.get("body", ""):
                  existing = comment
                  break

          if existing:
              # PR更新時はコメントを増殖させず更新
              comment_url = (
                  f"https://api.github.com/repos/{repository}"
                  f"/issues/comments/{existing['id']}"
              )

              response = requests.patch(
                  comment_url,
                  headers=headers,
                  json={"body": body},
                  timeout=30,
              )

          else:
              response = requests.post(
                  comments_url,
                  headers=headers,
                  json={"body": body},
                  timeout=30,
              )

          response.raise_for_status()

          print("AI review posted successfully.")
          PY
