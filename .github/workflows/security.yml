name: Security checks

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 依存関係の変更を検査
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0, CC0-1.0, 0BSD, Unlicense, Zlib, LicenseRef-scancode-google-patent-license-golang
          # TruffleHog is an unmodified CI-only scanner; it is neither linked
          # into nor distributed with the Samurai-meet product.
          allow-dependencies-licenses: pkg:githubactions/trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318

  osv-pr:
    name: OSV dependency vulnerability scan
    if: ${{ github.event_name == 'pull_request' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      fail-on-vuln: true
      scan-args: |-
        --include-git-root
        -r
        ./

  osv-full:
    name: OSV full vulnerability scan
    if: ${{ github.event_name != 'pull_request' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      fail-on-vuln: true
      scan-args: |-
        --include-git-root
        -r
        ./

  go-security:
    name: Go vulnerability and static security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: チェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Go をセットアップ
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
          check-latest: true
          cache: true

      - name: 非推奨のOpenPGP実装を禁止
        run: >-
          ! rg -n 'golang\.org/x/crypto/openpgp' --glob '*.go' .

      - name: 既知脆弱性を検査
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Go の危険な実装を検査
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -exclude-generated ./...

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: チェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 秘密情報の混入を検査
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          version: 3.97.0

  workflow-security:
    name: GitHub Actions workflow security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
    steps:
      - name: チェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: GitHub Actions ワークフローを静的検査
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2

  report:
    name: Security report
    if: ${{ always() }}
    needs: [dependency-review, osv-pr, osv-full, go-security, secret-scan, workflow-security]
    runs-on: ubuntu-latest
    steps:
      - name: 実行結果をサマリーへ出力
        env:
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          OSV_PR: ${{ needs.osv-pr.result }}
          OSV_FULL: ${{ needs.osv-full.result }}
          GO_SECURITY: ${{ needs.go-security.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
          WORKFLOW_SECURITY: ${{ needs.workflow-security.result }}
        run: |
          {
            echo "# Security checks"
            echo
            echo "| 検査 | 結果 |"
            echo "| --- | --- |"
            echo "| Dependency review | ${DEPENDENCY_REVIEW} |"
            echo "| OSV PR scan | ${OSV_PR} |"
            echo "| OSV full scan | ${OSV_FULL} |"
            echo "| Go vulnerability and static security scan | ${GO_SECURITY} |"
            echo "| Secret scan | ${SECRET_SCAN} |"
            echo "| GitHub Actions workflow security scan | ${WORKFLOW_SECURITY} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 失敗時に集約チェックを失敗させる
        if: >-
          ${{
            (needs.dependency-review.result != 'success' && needs.dependency-review.result != 'skipped') ||
            (needs.osv-pr.result != 'success' && needs.osv-pr.result != 'skipped') ||
            (needs.osv-full.result != 'success' && needs.osv-full.result != 'skipped') ||
            needs.go-security.result != 'success' ||
            needs.secret-scan.result != 'success' ||
            needs.workflow-security.result != 'success'
          }}
        run: exit 1
