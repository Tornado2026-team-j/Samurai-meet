name: Frontend CI

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Bun quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: チェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bun をセットアップ
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Bun依存キャッシュを復元
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: 依存を固定lockfileから復元
        run: bun install --frozen-lockfile

      - name: 型検査
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: テスト
        run: bun run test

  dependency-audit:
    name: Bun dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: チェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bun をセットアップ
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Bun依存キャッシュを復元
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: 依存を固定lockfileから復元
        run: bun install --frozen-lockfile

      - name: 既知の依存脆弱性を検査
        run: bun run security:audit

  report:
    name: Frontend CI report
    if: ${{ always() }}
    needs: [quality, dependency-audit]
    runs-on: ubuntu-latest
    steps:
      - name: 実行結果をサマリーへ出力
        env:
          QUALITY: ${{ needs.quality.result }}
          AUDIT: ${{ needs.dependency-audit.result }}
        run: |
          {
            echo "# Frontend CI"
            echo
            echo "| 検査 | 結果 |"
            echo "| --- | --- |"
            echo "| Bun quality | ${QUALITY} |"
            echo "| Bun dependency audit | ${AUDIT} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 失敗時に集約チェックを失敗させる
        if: ${{ needs.quality.result != 'success' || needs.dependency-audit.result != 'success' }}
        run: exit 1
