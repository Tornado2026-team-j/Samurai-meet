name: PR CI report

on:
  workflow_run:
    workflows:
      - Backend CI
      - Frontend CI
      - Security checks
      - CodeQL
    types: [completed]

permissions:
  contents: read
  checks: read
  pull-requests: write

jobs:
  report:
    name: Consolidated PR report
    if: >-
      ${{
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.pull_requests[0].number
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 完了済みの全必須チェックをPRコメントへ集約
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const pullRequest = context.payload.workflow_run.pull_requests[0];
            const requiredChecks = [
              'CI report',
              'Frontend CI report',
              'Security report',
              'Analyze (go)',
              'Analyze (javascript-typescript)',
            ];
            const { data } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.workflow_run.head_sha,
              filter: 'latest',
              per_page: 100,
            });
            const checks = new Map(data.check_runs.map((check) => [check.name, check]));
            const results = requiredChecks.map((name) => ({ name, check: checks.get(name) }));

            if (results.some(({ check }) => !check || check.status !== 'completed')) {
              core.info('全必須チェックの完了を待機します。');
              return;
            }

            const icon = (conclusion) => conclusion === 'success' ? '✅' : '❌';
            const rows = results.map(({ name, check }) => {
              const result = check.conclusion ?? 'unknown';
              return `| ${name} | ${icon(result)} ${result} | [ログ](${check.html_url}) |`;
            });
            const marker = '<!-- samurai-meet-ci-report -->';
            const body = `${marker}\n## CI結果（集約）\n\n| チェック | 結果 | 詳細 |\n| --- | --- | --- |\n${rows.join('\n')}\n\nこのコメントは各ワークフローの完了後に1件だけ更新されます。`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequest.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                body,
              });
            }
